<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DESENREDO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Anton&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8f9f9;--bg2:#d6f8f4;--p1:#5fc9c9;--p2:#8adedb;--card:#ffffff;--ink:#0b3a3a;--mute:#1d5a59;--tq:#5fc9c9;--tqd:#0a7a7a;--pu:#7c3aed;--or:#ff7a1a;--line:#bfeeee;--ok:#16a34a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#062b2c;--bg2:#08403f;--card:#0b3d3d;--ink:#e6fffd;--mute:#8fc9c5;--tq:#19d3cb;--tqd:#0fb5ae;--pu:#a78bfa;--or:#ff9442;--line:#16605e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#062b2c;--bg2:#08403f;--card:#0b3d3d;--ink:#e6fffd;--mute:#8fc9c5;--tq:#19d3cb;--tqd:#0fb5ae;--pu:#a78bfa;--or:#ff9442;--line:#16605e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,var(--p1),var(--p2));color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--p1);z-index:10}
.wrap{max-width:640px;margin:0 auto;padding:18px 22px 120px}
.logo{font-weight:900;letter-spacing:.5px;line-height:1}
.logo .d{color:var(--pu)}.logo .e{color:var(--or)}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 12px}
header .logo{font-size:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;margin:22px 0;box-shadow:0 6px 24px rgba(63,224,214,.18)}
.hero{text-align:center;padding:56px 22px 48px}
.hero .logo{font-size:clamp(38px,12vw,64px)}
.hero p{color:var(--mute);margin:10px auto 18px;max-width:460px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.stat{background:var(--bg);border-radius:12px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--tqd)}.stat span{font-size:12px;color:var(--mute)}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;background:var(--tq);color:#032a29}
button.or{background:var(--or);color:#2b1200}button.pu{background:var(--pu);color:#fff}
button.gh{background:transparent;border:1.5px solid var(--tq);color:var(--ink)}
button.sm{padding:6px 12px;font-size:14px}
button:disabled{opacity:.5;cursor:not-allowed}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);z-index:5}
nav button{flex:1;max-width:150px;background:transparent;color:var(--mute);padding:8px 4px;font-size:13px}
nav button.on{background:var(--tq);color:#032a29}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:18px 0 6px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--tq);border-color:var(--tq)}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
h2{margin:4px 0 6px;font-size:20px}h3{margin:0;font-size:17px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--bg);color:var(--tqd);margin:2px 4px 2px 0}
.tag.o{background:rgba(255,122,26,.16);color:var(--or)}.tag.p{background:rgba(124,58,237,.14);color:var(--pu)}.tag.g{background:rgba(22,163,74,.15);color:var(--ok)}
.mute{color:var(--mute);font-size:14px}
.steps{display:grid;gap:22px}.step{display:flex;gap:12px;align-items:flex-start}
.step i{flex:none;width:30px;height:30px;border-radius:50%;background:var(--tq);color:#032a29;display:grid;place-items:center;font-style:normal;font-weight:800}
.chat{max-height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px 0}
.msg{max-width:82%;padding:8px 12px;border-radius:14px;background:var(--bg);align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--tq);color:#032a29}
.msg small{display:block;font-size:11px;opacity:.7}
.warn{border-left:4px solid var(--or);padding:8px 12px;background:rgba(255,122,26,.1);border-radius:8px;font-size:14px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:12px 0}.chk input{width:auto;margin-top:4px}
.logo{font-family:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;font-weight:400;letter-spacing:1px}
.ptitle{font-family:'Lilita One',system-ui,sans-serif;font-weight:400;font-size:32px;margin:22px 0 2px}
.space{height:18px}
.hero .logo{font-size:clamp(48px,16vw,80px)}
.hero p{font-size:17px;margin:20px auto 30px}
header{padding:12px 2px 20px}
h2{font-size:22px;margin:0 0 14px}
.card:has(.stats){background:transparent;box-shadow:none;border:0;padding:0}
.row{gap:12px}
header .logo{background:var(--card);padding:6px 18px 8px;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--p1:#062b2c;--p2:#08403f}}
:root[data-theme="dark"]{--p1:#062b2c;--p2:#08403f}
.lema{display:flex;flex-direction:column;gap:8px;margin:26px 0 0;color:#000;font-family:'Berthold Block','Anton',Impact,'Arial Black',sans-serif;font-weight:400;text-transform:uppercase;line-height:1.05;letter-spacing:.5px}
.lema span:first-child{font-size:clamp(24px,7.5vw,38px)}.lema span:last-child{font-size:clamp(19px,5.8vw,30px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lema{color:var(--ink)}}
:root[data-theme="dark"] .lema{color:var(--ink)}.prov{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--card);color:var(--ink);border:1.5px solid var(--line);margin-bottom:10px;padding:12px 16px}
header{flex-wrap:wrap;gap:10px}
.sep{text-align:center;color:var(--mute);font-size:13px;margin:8px 0 0}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0b3a3a;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .25s;z-index:20;max-width:90%;text-align:center;pointer-events:none}
</style></head>

function applyUser(u){

  const m=me();
  $('#who').innerHTML=uid?`<button class="gh sm" data-go="perfil" style="padding:3px 12px 3px 3px;display:inline-flex;align-items:center;gap:8px;border-radius:99px">${av(m,30)} ${esc(m?m.name:'Mi perfil')}</button> <button class="${pend==='logout'?'or':'gh'} sm" data-act="logout">${pend==='logout'?'Pulsa otra vez para cerrar':'Cerrar sesión'}</button>`:'';
  const T=[['inicio','🏠','Inicio'],['mediadores','🤝','Mediadores'],['misiones','📍','Misiones'],['chat','💬','Chat'],['perfil','👤','Perfil']];
  $('#nav').innerHTML=T.map(t=>`<button class="${(tab===t[0]||(t[0]==='mediadores'&&tab==='registro')||(t[0]==='misiones'&&tab==='nueva'))?'on':''}" data-tab="${t[0]}">${t[1]}<br>${t[2]}</button>`).join('');
  const d=$('#c_text'),draft=d?d.value:'',had=d&&document.activeElement===d;
  if(fromData&&(tab==='registro'||tab==='nueva'||tab==='perfil'))return;
  $('#app').innerHTML=banner()+(err?`<div class="card warn">${esc(err)}</div>`:'')+(pendingUser?views.verify():uid||tab==='inicio'?views[tab]():tab==='correo'?views.correo():views.login());
  const cb=$('#chatbox');if(cb)cb.scrollTop=cb.scrollHeight;
  const nd=$('#c_text');if(nd&&draft){nd.value=draft;if(had)nd.focus()}
}
function offline(){return `<div class="card warn">Para registrarte y hablar con otros mediadores necesitas abrir esta página con tu sesión de Claude iniciada. Mientras tanto puedes ver cómo funciona.</div>`}
const views={
login(){return `${back('inicio')}<h2 class="ptitle">Iniciar sesión</h2><p class="mute">Elige cómo quieres iniciar sesión.</p><div class="card">${provBtns()}</div>`},
correo(){return `${back('login')}<h2 class="ptitle">Correo electrónico</h2><p class="mute">Si no tienes cuenta, pulsa Crear cuenta. Te enviaremos un correo para verificarla.</p><div class="card"><label style="margin-top:0">Correo</label><input id="l_mail" type="email" autocomplete="email"><label>Contraseña (mínimo 6 caracteres)</label><input id="l_pass" type="password" autocomplete="current-password"><div class="row" style="margin-top:22px"><button data-act="signin">Iniciar sesión</button><button class="or" data-act="signup">Crear cuenta</button></div></div>`},
verify(){const u=pendingUser;return `<h2 class="ptitle">Verifica tu correo</h2><div class="card"><p style="margin-top:0">Te hemos enviado un correo a <b>${esc(u.email)}</b>. Ábrelo y pulsa el enlace de verificación. Si no lo ves, mira en spam.</p><div class="row" style="margin-top:18px"><button data-act="checkv">Ya lo he verificado</button><button class="gh" data-act="resend">Reenviar correo</button></div><div style="margin-top:16px"><button class="${pend==='logout'?'or':'gh'} sm" data-act="logout">${pend==='logout'?'Pulsa otra vez para cerrar':'Cerrar sesión'}</button></div></div>`},
inicio(){
  const centers=new Set(reqs.filter(r=>r.status!=='resuelta').map(r=>(r.center||'').toLowerCase())).size;
  return `<div class="card hero"><img src="${LOGO}" alt="Logo de DESENREDO" style="width:150px;height:150px;display:block;margin:-14px auto 6px"><div class="logo"><span class="d">DES</span><span class="e">ENREDO</span></div>
  <div class="lema"><span>Hablando y Colaborando</span><span>Los Nudos Vamos Desenredando</span></div>
  <p>Red de mediadores voluntarios que se coordinan para acudir a colegios, institutos y universidades y ayudar a resolver conflictos.</p>
  <div class="row"><button data-go="registro" class="or">Quiero ayudar</button><button data-go="nueva" class="gh">Pedir mediación</button></div></div>
  <div class="card"><div class="stats"><div class="stat"><b>${mediators.length}</b><span>mediadores</span></div><div class="stat"><b>${reqs.filter(r=>r.status!=='resuelta').length}</b><span>misiones abiertas</span></div><div class="stat"><b>${centers}</b><span>centros</span></div></div></div>
  <div class="card"><h2>Cómo funciona</h2><div class="steps">
  <div class="step"><i>1</i><div><b>Regístrate</b><br><span class="mute">Cuéntanos tu zona y tu disponibilidad.</span></div></div>
  <div class="step"><i>2</i><div><b>Elige una misión</b><br><span class="mute">Un centro pide ayuda y los mediadores se apuntan.</span></div></div>
  <div class="step"><i>3</i><div><b>Coordínate</b><br><span class="mute">Chat del equipo para decidir cómo y cuándo ir.</span></div></div></div></div>
  <div class="card warn">DESENREDO no sustituye a servicios de emergencia ni a la dirección del centro. Si hay riesgo físico, llama al 112 y avisa al profesorado.</div>`},
registro(){
  const m=me();
  const form=`<div class="card"><h2>${m?'Tu perfil':'Regístrate como mediador'}</h2>
  <label>Nombre o apodo</label><input id="f_name" maxlength="40" value="${esc(m?.name)}">
  <div class="row"><div><label>Ciudad / zona</label><input id="f_zone" maxlength="50" value="${esc(m?.zone)}"></div>
  <div><label>Perfil</label><select id="f_role">${['Estudiante','Docente','Psicología / trabajo social','Familia','Otro'].map(o=>`<option ${m?.role===o?'selected':''}>${o}</option>`).join('')}</select></div></div>
  <label>Disponibilidad</label><input id="f_av" maxlength="60" placeholder="Ej: tardes y fines de semana" value="${esc(m?.av)}">
  <label>Experiencia o por qué quieres ayudar</label><textarea id="f_bio" maxlength="300">${esc(m?.bio)}</textarea>
  ${m?'':'<label class="chk"><input type="checkbox" id="f_ok"><span>Me comprometo a escuchar sin juzgar, respetar la confidencialidad y actuar siempre con el permiso del centro. Si soy menor, cuento con autorización de mi familia o del centro.</span></label>'}
  <div class="row"><button data-act="saveMed" ${db&&uid?'':'disabled'}>${m?'Guardar cambios':'Unirme a DESENREDO'}</button>${m?`<button class="${pend==='leave'?'or':'gh'}" data-act="leave">${pend==='leave'?'Pulsa otra vez para darte de baja':'Darme de baja'}</button>`:''}</div></div>`;
  return back('inicio')+form},
mediadores(){
  const list=mediators.map(x=>`<div class="card"><div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">${av(x,44)}<h3>${esc(x.name)}</h3></div><span class="tag p">${esc(x.role)}</span><span class="tag">${esc(x.zone)}</span><span class="tag o">${esc(x.av||'Disponibilidad a convenir')}</span>${x.bio?`<p class="mute" style="margin:6px 0 0">${esc(x.bio)}</p>`:''}</div>`).join('');
  return `<h2 class="ptitle">Mediadores</h2><p class="mute">${mediators.length} voluntarios en la red</p><button class="or" data-go="${me()?'perfil':'registro'}">${me()?'Mi perfil':'Quiero registrarme'}</button><div class="space"></div>`+(list||'<div class="card mute">Aún no hay mediadores. ¡Sé el primero!</div>')},
nueva(){
  const m=me();
  const form=`<div class="card"><h2>Pedir mediación</h2>
  <div class="row"><div><label>Tipo de centro</label><select id="r_type">${PLACES.map(p=>`<option>${p}</option>`).join('')}</select></div>
  <div><label>Nombre del centro</label><input id="r_center" maxlength="60"></div></div>
  <div class="row"><div><label>Ciudad</label><input id="r_city" maxlength="50"></div><div><label>Fecha propuesta</label><input id="r_date" type="date"></div></div>
  <label>¿Qué está pasando? (sin nombres de personas)</label><textarea id="r_desc" maxlength="400"></textarea>
  <button class="or" data-act="newReq" ${db&&uid?'':'disabled'} style="margin-top:10px">Publicar misión</button></div>`;
  return back('misiones')+form},
misiones(){
  const m=me();
  const list=reqs.map(r=>{const n=joinedCount(r.id),joined=(m?.joined||[]).includes(r.id),done=r.status==='resuelta';
    return `<div class="card"><h3>${esc(r.center)}</h3><span class="tag p">${esc(r.type)}</span><span class="tag">${esc(r.city)}</span>${r.date?`<span class="tag o">${esc(r.date)}</span>`:''}${done?'<span class="tag g">Resuelta</span>':''}
    <p style="margin:8px 0">${esc(r.desc)}</p><div class="mute">👥 ${n} mediador${n===1?'':'es'} apuntado${n===1?'':'s'}</div>
    <div class="row" style="margin-top:10px">${done?'':`<button class="sm ${joined?'gh':''}" data-act="join" data-id="${r.id}" ${m?'':'disabled'}>${joined?'Salir':'Me apunto'}</button>`}
    <button class="sm pu" data-act="room" data-id="${r.id}">Ir al chat</button>
    ${r.by===uid&&!done?`<button class="sm gh" data-act="done" data-id="${r.id}">Marcar resuelta</button>`:''}
    ${r.by===uid?`<button class="sm ${pend===r.id?'or':'gh'}" data-act="del" data-id="${r.id}">${pend===r.id?'Pulsa otra vez para eliminar':'Eliminar misión'}</button>`:''}</div></div>`}).join('');
  return (m?'':'<div class="card warn">Regístrate como mediador para apuntarte a misiones.</div>')+`<h2 class="ptitle">Misiones</h2><p class="mute">${reqs.filter(r=>r.status!=='resuelta').length} abiertas</p><button class="or" data-go="nueva">Pedir mediación</button><div class="space"></div>`+(list||'<div class="card mute">No hay misiones todavía.</div>')},
perfil(){
  const m=me(),u=auth.currentUser,pw=!!u&&u.providerData.some(p=>p.providerId==='password');
  const photo=m?`<div class="card"><h2>Foto de perfil</h2><div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">${av(m,84)}<div><label class="btn" for="p_file" style="display:inline-block;margin:0;cursor:pointer;color:#032a29">Subir foto</label><input id="p_file" type="file" accept="image/*" style="display:none">${m.photo?`<button class="gh sm" data-act="rmphoto" style="margin-left:8px">Quitar</button>`:''}</div></div></div>`:'';
  const phone=`<div class="card"><h2>Teléfono</h2><p class="mute" style="margin-top:0">Solo lo ves tú. No se comparte con otros mediadores.</p><label style="margin-top:0">Número de teléfono</label><input id="p_phone" type="tel" maxlength="20" placeholder="+34 600 000 000" value="${esc(myPriv.phone)}"><button data-act="savePhone" style="margin-top:14px">Guardar teléfono</button></div>`;
  const acct=`<div class="card"><h2>Cuenta</h2><p class="mute" style="margin-top:0">${esc(u?u.email:'')}</p>${pw?'<label>Contraseña (para confirmar)</label><input id="d_pass" type="password" autocomplete="current-password">':''}<div style="margin-top:16px"><button class="gh" data-act="delacc">Eliminar mi cuenta</button></div><p class="mute" style="margin-bottom:0">Se borran tu perfil, tus misiones y tus datos. No se puede deshacer.</p></div>`;
  return back('inicio')+`<h2 class="ptitle">Mi perfil</h2>`+photo+views.registro().replace(back('inicio'),'')+phone+acct},
chat(){
  const m=me();
  const mine=reqs.filter(r=>r.by===uid||(m&&(m.joined||[]).includes(r.id)));
  let rq=reqs.find(r=>r.id===room);
  if(!rq){rq=mine[0];room=rq?rq.id:''}
  if(!rq)return `<h2 class="ptitle">Chat</h2><div class="card"><p style="margin-top:0">Cada misión tiene su propio chat. Apúntate a una misión o crea una para hablar con el equipo.</p><button class="or" data-go="misiones">Ver misiones</button></div>`;
  const opts=mine.includes(rq)?mine:mine.concat([rq]);
  const can=m&&((m.joined||[]).includes(room)||rq.by===uid);
  const crew=mediators.filter(x=>(x.joined||[]).includes(room)).map(x=>esc(x.name)).join(', ');
  const list=msgs.filter(x=>x.room===room).map(x=>`<div class="msg ${x.by===uid?'me':''}"><small>${esc(x.name)}</small>${esc(x.text)}</div>`).join('');
  return `<h2 class="ptitle">${esc(rq.center)}</h2><p class="mute">${esc(rq.type)} · ${esc(rq.city)}${rq.date?' · '+esc(rq.date):''}<br>👥 ${crew||'Aún nadie apuntado'}</p><div class="card"><label style="margin-top:0">Misión</label><select id="c_room">${opts.map(r=>`<option value="${esc(r.id)}" ${r.id===room?'selected':''}>${esc('📍 '+r.center)}</option>`).join('')}</select><div class="chat" id="chatbox">${list||'<div class="mute">Aún no hay mensajes. ¡Rompe el hielo!</div>'}</div>${can?`<div class="row" style="margin-top:10px;flex-wrap:nowrap"><input id="c_text" maxlength="300" placeholder="Escribe al equipo…" style="flex:3"><button data-act="send" style="flex:1;min-width:80px">Enviar</button></div>`:(m?`<div class="warn" style="margin-top:10px">Apúntate a la misión para escribir en su chat.</div><button class="sm" data-act="join" data-id="${esc(room)}" style="margin-top:12px">Me apunto</button>`:'<div class="warn" style="margin-top:10px">Regístrate como mediador para escribir.</div>')}<p class="mute" style="margin-bottom:0">Comparte detalles personales solo si es necesario y nunca datos de menores.</p></div>`}
};
const val=id=>($('#'+id)?.value||'').trim();
const banner=()=>notices.filter(n=>n.to===uid).map(n=>`<div class="card warn"><b>Aviso</b><br>${esc(n.text)}<div style="margin-top:10px"><button class="sm" data-act="ack" data-id="${esc(n.id)}">Entendido</button></div></div>`).join('');
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,3500)};
window.alert=m=>toast(String(m));
const back=t=>`<button class="gh sm" data-go="${t}">← Volver</button>`;
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-tab],[data-go],[data-act]');if(!t)return;
  if(t.dataset.tab||t.dataset.go){pend=null;const nt=t.dataset.tab||t.dataset.go;if(nt!=='login'&&nt!=='correo')dest=nt;tab=nt;render();scrollTo(0,0);return}
  const a=t.dataset.act,id=t.dataset.id;
  try{
    if(a==='rmphoto'){await db.collection('mediators').doc(uid).update({photo:''});render();return}
    if(a==='savePhone'){const ph=val('p_phone');if(ph&&!/^[+0-9 ()-]{6,20}$/.test(ph))return toast('Escribe un teléfono válido.');await db.collection('private').doc(uid).set({phone:ph});myPriv={phone:ph};toast('Teléfono guardado.');return}
    if(a==='delacc'){
      if(pend!=='del-acc'){pend='del-acc';t.className='or';t.textContent='Pulsa otra vez para eliminar mi cuenta';setTimeout(()=>{if(pend==='del-acc'){pend=null;t.className='gh';t.textContent='Eliminar mi cuenta'}},5000);return}
      pend=null;const u=auth.currentUser;
      try{if(u.providerData.some(p=>p.providerId==='password')){const pw=$('#d_pass').value;if(!pw){toast('Escribe tu contraseña para confirmar.');return}await reauthenticateWithCredential(u,EmailAuthProvider.credential(u.email,pw))}else await reauthenticateWithPopup(u,new GoogleAuthProvider())}catch(x){toast(authMsg(x.code));return}
      const own=reqs.filter(r=>r.by===uid);
      await Promise.all([...own.flatMap(r=>[db.collection('requests').doc(r.id).delete(),...msgs.filter(x=>x.room===r.id).map(x=>db.collection('messages').doc(x.id).delete())]),db.collection('mediators').doc(uid).delete(),db.collection('private').doc(uid).delete()]);
      await deleteUser(u);tab='inicio';toast('Cuenta eliminada.');return}
    if(a==='checkv'){await auth.currentUser.reload();const u=auth.currentUser;if(u.emailVerified){await u.getIdToken(true);applyUser(u);toast('¡Correo verificado!')}else toast('Aún no está verificado. Revisa tu correo (y el spam).');return}
    if(a==='resend'){await sendEmailVerification(auth.currentUser);toast('Correo reenviado.');return}
    if(a==='prov'){const p=new GoogleAuthProvider();try{await signInWithPopup(auth,p)}catch(x){toast(authMsg(x.code))}return}
    if(a==='signin'||a==='signup'){const e=val('l_mail'),p=$('#l_pass').value;if(!e||!p)return toast('Escribe tu correo y contraseña.');
      try{if(a==='signin')await signInWithEmailAndPassword(auth,e,p);else{const c=await createUserWithEmailAndPassword(auth,e,p);await sendEmailVerification(c.user);toast('Te hemos enviado un correo de verificación.')}}catch(x){toast(authMsg(x.code))}return}
    if(a==='logout'){if(pend!=='logout'){pend='logout';render();setTimeout(()=>{if(pend==='logout'){pend=null;render()}},4000);return}pend=null;await signOut(auth);tab='inicio';render();toast('Sesión cerrada');return}
    if(a==='saveMed'){const name=val('f_name'),zone=val('f_zone');
      if(!name||!zone)return alert('Pon al menos tu nombre y tu zona.');
      if(!me()&&!$('#f_ok').checked)return alert('Debes aceptar el compromiso para registrarte.');
      const d={name,zone,role:val('f_role'),av:val('f_av'),bio:val('f_bio'),joined:me()?.joined||[],photo:me()?.photo||'',ts:Date.now()};
      await db.collection('mediators').doc(uid).set(d);document.activeElement.blur();tab='mediadores';render();scrollTo(0,0)}
    if(a==='leave'){if(pend!=='leave'){pend='leave';render();return}pend=null;await db.collection('mediators').doc(uid).delete();tab='mediadores';render();scrollTo(0,0);toast('Te has dado de baja. ¡Gracias por ayudar!')}
    if(a==='newReq'){const center=val('r_center'),desc=val('r_desc');
      if(!center||!desc)return alert('Indica el centro y qué está pasando.');
      await db.collection('requests').doc('r'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)).set({type:val('r_type'),center,city:val('r_city'),date:val('r_date'),desc,by:uid,status:'abierta',ts:Date.now()});
      document.activeElement.blur();tab='misiones';render();scrollTo(0,0)}
    if(a==='join'){const j=new Set(me().joined||[]);const was=j.has(id);was?j.delete(id):j.add(id);await db.collection('mediators').doc(uid).update({joined:[...j]});if(!was){room=id;tab='chat';render();scrollTo(0,0)}}
    if(a==='done')await db.collection('requests').doc(id).update({status:'resuelta'});
    if(a==='ack')await db.collection('notices').doc(id).delete();
    if(a==='del'){const r=reqs.find(x=>x.id===id);if(!r||r.by!==uid)return;
      if(pend!==id){pend=id;render();return}
      pend=null;const crew=mediators.filter(x=>(x.joined||[]).includes(id)&&x.id!==uid);
      await Promise.all(crew.map((x,i)=>db.collection('notices').doc('n'+Date.now().toString(36)+i+Math.random().toString(36).slice(2,5)).set({to:x.id,text:'La misión de '+r.center+' ('+r.city+') ha sido eliminada por quien la creó. Su chat se ha cerrado.',ts:Date.now()})));
      await Promise.all(msgs.filter(x=>x.room===id).map(x=>db.collection('messages').doc(x.id).delete()));
      await db.collection('requests').doc(id).delete();
      if(room===id)room='general';toast('Misión eliminada y equipo avisado')}
    if(a==='room'){room=id;tab='chat';render()}
    if(a==='send'){const text=val('c_text');if(!text)return;$('#c_text').value='';
      await db.collection('messages').doc('m'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)).set({room,text,by:uid,name:me().name,ts:Date.now()})}
  }catch(x){alert('No se pudo completar: '+(x.message||x.code||x))}
});
document.addEventListener('change',async e=>{
  if(e.target.id==='c_room'){room=e.target.value;render()}
  if(e.target.id==='p_file'&&e.target.files[0]){try{
    const bmp=await createImageBitmap(e.target.files[0]);const S=160,c=document.createElement('canvas');c.width=c.height=S;
    const k=Math.min(bmp.width,bmp.height);c.getContext('2d').drawImage(bmp,(bmp.width-k)/2,(bmp.height-k)/2,k,k,0,0,S,S);
    await db.collection('mediators').doc(uid).update({photo:c.toDataURL('image/jpeg',.8)});render();toast('Foto actualizada.')
  }catch(x){toast('No se pudo cambiar la foto.')}}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='c_text'){e.preventDefault();document.querySelector('[data-act=send]').click()}});

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='l_pass')document.querySelector('[data-act=signin]').click()});
document.querySelectorAll('.lg').forEach(i=>i.src=LOGO);
{const l=document.createElement('link');l.rel='icon';l.href=LOGO;document.head.appendChild(l)}
boot();
</script></body></html>
